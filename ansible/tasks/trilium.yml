---
# docs at https://docs.triliumnotes.org/user-guide/setup/server/installation/packaged-server
- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - xz-utils
      - tar
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create Trilium install folder
  ansible.builtin.file:
    path: "{{ trilium_install_folder }}"
    state: directory
    mode: "0755"

- name: Download and extract Trilium binaries
  ansible.builtin.unarchive:
    src: "{{ trilium_repo_url }}"
    dest: "{{ trilium_install_folder }}"
    remote_src: true
    extra_opts: ["--strip-components=1"]
    creates: "{{ trilium_install_folder }}/trilium.sh"
  notify: Restart trilium

- name: Create Trilium systemd service file
  ansible.builtin.template:
    src: trilium/trilium.service.j2
    dest: /etc/systemd/system/trilium.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart trilium

- name: Enable and start Trilium
  ansible.builtin.systemd_service:
    name: trilium
    state: started
    enabled: true
    daemon_reload: true